name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip uninstall -y setuptools
          python -m pip install -e ".[dev]"
      - name: Ruff formatting
        run: python -m ruff format --check packages apps scripts
      - name: Ruff lint
        run: python -m ruff check packages apps scripts
      - name: Strict type checking
        run: python -m mypy packages/causalbio-core/src apps/api/src packages/causalbio-core/tests apps/api/tests
      - name: Validate deterministic evaluation fixtures
        run: python scripts/run_evals.py
      - name: Seed both curated packs
        run: python scripts/seed_demo_data.py --database "$RUNNER_TEMP/causalbio.sqlite3"
      - name: Validate curated graph integrity
        run: python scripts/validate_graph.py
      - name: Check public files and documentation links
        run: |
          python scripts/check_public_files.py
          python scripts/check_docs.py
      - name: Python tests with coverage
        run: >-
          python -m pytest
          --cov=causalbio
          --cov=causalbio_api
          --cov-report=term-missing
          --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: error

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Prettier formatting
        run: pnpm format:web
      - name: ESLint
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck
      - name: Component tests
        run: pnpm test
      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build

  integration:
    name: Browser workflow
    needs: [python, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Python application
        run: |
          python -m pip install --upgrade pip
          python -m pip uninstall -y setuptools
          python -m pip install -e ".[dev]"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @causalbio/web exec playwright install --with-deps chromium
      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build
      - name: Run critical browser workflows
        env:
          CAUSALBIO_PYTHON: python
          CAUSALBIO_E2E_PRODUCTION: "1"
          CI: "true"
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore

  containers:
    name: Container build
    needs: [python, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build API and web images
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: docker compose build

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
